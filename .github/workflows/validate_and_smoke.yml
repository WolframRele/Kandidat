name: Validate & Smoke tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pywer numpy python-Levenshtein weighted-levenshtein regex
      - name: Run validate_inputs.py
        run: python tools/validate_inputs.py --check

  smoke:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install kalkulator deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pywer numpy python-Levenshtein weighted-levenshtein regex
      - name: Run smoke kalkulators
        run: |
          python tools/smoke_kalkulators.py --langs eng-uk
